name: Android APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS dependencies
        run: npm ci

      - name: Build web bundle and sync Capacitor
        run: npm run cap:sync

      - name: Build the PTY helper (native, arm64) into jniLibs
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          DEST=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          "$NDK_BIN/aarch64-linux-android24-clang" -shared -fPIC -O2 -Wall \
            -o "$DEST/libptyhelper.so" native/ptyhelper/pty_jni.c
          "$NDK_BIN/llvm-strip" --strip-unneeded "$DEST/libptyhelper.so"
          ls -la "$DEST"

      - name: Build debug APK
        working-directory: android
        env:
          # The GitHub Ubuntu runner ships the Android SDK preinstalled.
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: traliran-ai-hub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
