# Builds proot (ptrace-based chroot-like runner) for Android arm64 from the Termux source.
# Runs when this file changes on the session branch (and by hand from the Actions tab).
# Output: an artifact with libproot.so, libproot-loader.so and libtalloc.so for jniLibs/arm64-v8a.
name: proot (Android arm64)

on:
  workflow_dispatch:
  push:
    branches: [arena/8bf451fb-traliran-ai-hub]
    paths: ['.github/workflows/proot-android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch proot source (Termux fork)
        run: git clone --depth 1 https://github.com/termux/proot.git proot

      - name: Fetch libtalloc for aarch64 from the Termux repo
        run: |
          set -euo pipefail
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          FILE=$(awk '/^Package: libtalloc$/{f=1} f&&/^Filename:/{print $2; exit}' Packages)
          echo "talloc package: $FILE"
          curl -fsSL "$BASE/$FILE" -o libtalloc.deb
          mkdir talloc && cd talloc
          ar x ../libtalloc.deb
          tar -xf data.tar.* 
          find . -name 'libtalloc.so*' -o -name 'talloc.h' | head

      - name: Ensure talloc.h is available
        run: |
          set -euo pipefail
          mkdir -p talloc-include
          if [ -z "$(find talloc -name talloc.h 2>/dev/null | head -1)" ]; then
            echo "talloc.h not in the Termux package; using the upstream header from the Samba repo"
            curl -fsSL https://raw.githubusercontent.com/samba-team/samba/master/lib/talloc/talloc.h -o talloc-include/talloc.h
          fi
          # Listing is informational only. find exits non-zero when a path is missing.
          find talloc talloc-include -name talloc.h 2>/dev/null || true

      - name: Build proot and loader with the NDK
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TALLOC_LIB="$(realpath "$(find talloc -name 'libtalloc.so' | head -1)")"
          TALLOC_INC="$(realpath "$(dirname "$(find talloc talloc-include -name talloc.h 2>/dev/null | head -1)")")"
          mkdir -p out
          cp "$TALLOC_LIB" out/libtalloc.so
          # Set CFLAGS/LDFLAGS in the environment, not on the make command line:
          # command-line variables would override the Makefile's "LDFLAGS += -ltalloc".
          export CFLAGS="-I$TALLOC_INC -O2 -fPIE"
          export LDFLAGS="-L$PWD/out -Wl,-rpath,\$ORIGIN"
          # ashmem_memfd.c calls strcmp/memset without <string.h>; newer NDK clang rejects that.
          # Patch only that file. Force-including headers via CFLAGS breaks the loader's .S files.
          sed -i '1i #include <string.h>' proot/src/extension/ashmem_memfd/ashmem_memfd.c
          cd proot/src
          make clean >/dev/null 2>&1 || true
          make -j"$(nproc)" CC="$NDK_BIN/aarch64-linux-android24-clang" proot loader/loader
          ls -la proot loader/loader
          cp proot ../../out/libproot.so
          cp loader/loader ../../out/libproot-loader.so
          cd ../..
          ls -la out
          # Confirm the library dependency resolves to our bundled libtalloc.
          "$NDK_BIN/llvm-readelf" -d out/libproot.so | grep -i 'NEEDED\|RUNPATH\|RPATH' || true

      - uses: actions/upload-artifact@v4
        with:
          name: proot-android-arm64
          path: out/
          if-no-files-found: error
